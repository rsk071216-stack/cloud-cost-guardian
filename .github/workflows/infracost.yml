name: Infracost (shift-left cost)

# Comments the monthly cost difference of Terraform changes on pull requests.
# Runs only when the INFRACOST_API_KEY secret exists (free key: `infracost auth login`).
# Without it, or on pull requests from forks (no secrets), the job skips gracefully and stays green.

on:
  pull_request:
    paths:
      - "terraform/**"
      - "infracost.yml"
      - ".github/workflows/infracost.yml"

permissions:
  contents: read

concurrency:
  group: infracost-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cost-diff:
    name: Cost diff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # post/update the cost comment
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      INFRACOST_VERSION: "0.10.46"
    steps:
      - name: Check for Infracost API key
        id: key
        run: |
          if [[ -n "${INFRACOST_API_KEY}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Infracost skipped::INFRACOST_API_KEY secret is not configured (or this is a fork PR). Skipping cost diff."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Infracost
        if: steps.key.outputs.enabled == 'true'
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: ${{ env.INFRACOST_VERSION }}

      - name: Checkout base branch
        if: steps.key.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false

      - name: Checkout pull request
        if: steps.key.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - name: Cost baseline (base branch)
        if: steps.key.outputs.enabled == 'true'
        working-directory: base
        run: |
          if [[ -f infracost.yml ]]; then
            infracost breakdown --config-file=infracost.yml --format=json --out-file=/tmp/infracost-base.json
          else
            infracost breakdown --path=terraform --format=json --out-file=/tmp/infracost-base.json
          fi

      - name: Cost diff (pull request)
        if: steps.key.outputs.enabled == 'true'
        working-directory: head
        run: |
          infracost diff --config-file=infracost.yml --format=json \
            --compare-to=/tmp/infracost-base.json --out-file=/tmp/infracost.json

      - name: Comment on pull request
        if: steps.key.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          infracost comment github --path=/tmp/infracost.json \
            --repo="$GITHUB_REPOSITORY" \
            --github-token="$GITHUB_TOKEN" \
            --pull-request="$PR_NUMBER" \
            --behavior=update
